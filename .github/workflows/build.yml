name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sanctuary
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Prepare plugin artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'sanctuary-*.jar' ! -name '*-plain.jar' -print)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one shaded Sanctuary JAR, found ${#jars[@]}." >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          cp "${jars[0]}" dist/Sanctuary.jar

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v6
        with:
          name: sanctuary-${{ github.sha }}
          path: dist/Sanctuary.jar
          if-no-files-found: error
