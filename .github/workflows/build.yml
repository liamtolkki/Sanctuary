name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sanctuary
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v6
        with:
          name: sanctuary-${{ github.sha }}
          path: build/libs/sanctuary-*.jar
          if-no-files-found: error

      - name: Package source
        run: zip -r Sanctuary-sentry-ai-fix.zip . -x '.git/*' '.gradle/*' 'build/*' 'Sanctuary-sentry-ai-fix.zip'

      - name: Upload source archive
        uses: actions/upload-artifact@v6
        with:
          name: sanctuary-source-${{ github.sha }}
          path: Sanctuary-sentry-ai-fix.zip
          if-no-files-found: error
