database:
  filename: sanctuary.db

names:
  minimum-length: 1
  maximum-length: 32

anchors:
  initial-territory-radius: 19.2
  recovery:
    enabled: true
    cooldown-seconds: 300

territory:
  maximum-radius: 96.0
  spacing-margin: 16.0
  awareness:
    entry-title: true
    exit-message: false
    owner-entry-alerts: true
  boundary:
    particle-spacing: 1.5
    display-seconds: 10
    maximum-render-distance: 128.0
    particles:
      owner: SCULK_CHARGE_POP
      trusted: GLOW
      neutral: END_ROD
      hostile: REVERSE_PORTAL
    automatic:
      enabled: true
      minimum-distance: 3.0
      maximum-distance: 12.0
      vertical-particle-spacing: 1.5
      update-period-ticks: 10

protections:
  hard:
    enabled: false
    block-place: true
    block-break: true
    containers: true
    interactions: true
    redstone: true
    entities: true
