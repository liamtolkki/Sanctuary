name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v, for example 0.1.0-alpha.1
        required: true
        type: string
      prerelease:
        description: Mark this GitHub Release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

      - name: Checkout Sanctuary
        uses: actions/checkout@v6

      - name: Verify release tag is unused
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ inputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG already exists." >&2
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Build and test release
        run: ./gradlew clean build --no-daemon -PreleaseVersion=${{ inputs.version }}

      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'sanctuary-*.jar' ! -name '*-plain.jar' -print)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one shaded Sanctuary JAR, found ${#jars[@]}." >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          cp "${jars[0]}" dist/Sanctuary.jar
          sha256sum dist/Sanctuary.jar > dist/Sanctuary.jar.sha256

      - name: Create tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "${{ github.sha }}"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ inputs.version }}"
          ARGS=(
            "$TAG"
            dist/Sanctuary.jar
            dist/Sanctuary.jar.sha256
            --title "$TAG"
            --generate-notes
          )
          if [ '${{ inputs.prerelease }}' = 'true' ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"
